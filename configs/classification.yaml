benchmark:
  name: jev_bloomberg_basel
  spec_version: "1.1.0"

run:
  label: baseline
  seed: 917341            # MinHash seed for deduplication
  allow_dirty_git: false

dataset:
  provider: huggingface
  repository: danidanou/Bloomberg_Financial_News
  revision: "2db0c7e4d169e091762978637ecfa4f54c22fd81"
  file: bloomberg_financial_data.parquet.gzip
  file_sha256: "c0b40bce8aa440ef54cab90dd2b9671ca778eb8e20673b8a79e959e4049511e9"
  local_dir: data/hf

corpus:
  directory: corpus
  normalization_version: norm_v1
  dedupe:
    version: dedupe_v2_exact
    exact: sha256_normalized_headline_body
    near: none                   # exact duplicates only (user decision 2026-10-06)
    num_perm: 128
    shingle_words: 5
    jaccard_threshold: 0.90
    canonical_rule: earliest_date_then_article_id

ontology:
  path: gsib_basel_ontology_v1.0.json
  version: "1.0.0"
  sha256: "80a355a7fc2d0e50c74c1741b8903b5fc2e9dd923db37230212c4bec28d3228e"

input:
  mode: headline_plus_article
  max_chars: 12000
  separator: "\n\n"
  truncation_strategy: head
  normalization:
    unicode: NFC
    collapse_whitespace: true
    strip_html: true

hierarchy:
  traversal:
    mode: breadth_first
    threshold: 0.30
    max_depth: 10
    max_nodes_per_article: 100
  classification:
    positive_threshold: 0.50
  materialize_skipped_by_routing: false

templates:
  boolean_v1:
    kind: boolean
    path: templates/decision/boolean_v1.txt
    sha256: "df6bccc8cc3e851477f097455db5e4db4dc69a16273281ffc00129865e4717f6"

  gliclass_label_v1:
    kind: label
    path: templates/gliclass/label_v1.txt
    sha256: "ab2ace313c4d3794cbc8c07f617a12b23d149f206b0a20d7950c4d861bbbf1c5"

# All decision models (Jev, Laya, d1) are reached through Vercel AI Gateway with byte-identical requests;
# only `model` and `provider_lock` differ. The gateway exposes no dated versions,
# so identity is enforced via provider lock + returned-model check + catalog snapshot.
models:
  jev:
    enabled: true
    adapter: jev
    provider: vercel_ai_gateway
    endpoint: https://ai-gateway.vercel.sh
    model: typesafe-ai/jev
    provider_lock: [typesafe-ai]
    api_key_env: VERCEL_API_KEY
    template: boolean_v1
    timeout_seconds: 60
    retries: 6
    concurrency: 32
    allow_returned_model_mismatch: false

  laya:
    enabled: true
    adapter: laya
    provider: vercel_ai_gateway
    endpoint: https://ai-gateway.vercel.sh
    model: convaiinnovations/laya
    provider_lock: [boundless]
    api_key_env: VERCEL_API_KEY
    template: boolean_v1
    timeout_seconds: 60
    retries: 6
    concurrency: 32
    allow_returned_model_mismatch: false

  d1:
    enabled: true
    adapter: d1
    provider: vercel_ai_gateway
    endpoint: https://ai-gateway.vercel.sh
    model: liquid/d1
    provider_lock: [liquid]
    api_key_env: VERCEL_API_KEY
    template: boolean_v1
    timeout_seconds: 60
    retries: 6
    concurrency: 32
    allow_returned_model_mismatch: false

  # Open-weight zero-shot encoder, run locally (Colab GPU for the full corpus).
  # dtype and revision are material; device and batching are operational.
  gliclass:
    enabled: true
    adapter: gliclass
    provider: local
    endpoint: null
    model: knowledgator/gliclass-large-v3.0
    revision: e065d1844f913a9aa611cf33623a9538b8aa8841
    provider_lock: []
    api_key_env: null
    template: gliclass_label_v1
    device: cuda
    dtype: float16
    max_length: 512
    batch_size: 32
    batch_wait_ms: 20
    timeout_seconds: 600
    retries: 0
    concurrency: 128
    allow_returned_model_mismatch: false

output:
  directory: classification_results
  format: parquet
  shard_rows: 5000
  include_raw_provider_response: false
