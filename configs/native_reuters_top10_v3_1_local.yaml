# Self-hosted models (Strands, CLM) with the v3.1 QUESTIONS + CRITERIA (ontology_v3_1.json, template_v3.txt; developed on the training split only); otherwise identical to native_reuters_top10.yaml.
# NATIVE-TASK benchmark (native_benchmarks/reuters_top10/README.md): Reuters-21578 R(10) topics on the
# standard ModApte test set (2,545 stories), scored with macro-F1 against published results.
# Separate from the G-SIB study: own ontology, template, corpus and results directory; nothing shared is changed.
# Score with scripts/score_native_reuters.py. Run with --no-dev-eval (the synthetic dev set is G-SIB-only).
benchmark:
  name: native_reuters21578_top10
  spec_version: "1.1.0"

run:
  label: baseline
  seed: 917341            # MinHash seed for deduplication
  allow_dirty_git: false

dataset:
  # Reuters-21578 (CC BY 4.0), same archive as bench_reuters: ModApte TEST stories with a top-10 topic.
  provider: uci_reuters21578_top10
  repository: UCI ML Repository #137
  revision: "Distribution 1.0 (UCI download 2026-10-15)"
  file: "reuters21578.zip"
  file_sha256: "3741290be328c026dbb302ee7606d7afe65b21823c51dd3e5685347333b0da8a"
  local_dir: data/bench/reuters21578

corpus:
  directory: corpus_native/reuters_top10
  normalization_version: norm_v1
  dedupe:
    version: dedupe_v2_exact
    exact: sha256_normalized_headline_body
    near: none                   # exact duplicates only (user decision 2026-10-06)
    num_perm: 128
    shingle_words: 5
    jaccard_threshold: 0.90
    canonical_rule: earliest_date_then_article_id

ontology:
  path: native_benchmarks/reuters_top10/ontology_v3_1.json
  version: "3.1.0"
  sha256: "67455981971c7a0364a117852bd4ffffdd1b102dcf54b64da1b0dd5412018452"

input:
  mode: headline_plus_article
  max_chars: 12000
  separator: "\n\n"
  truncation_strategy: head
  normalization:
    unicode: NFC
    collapse_whitespace: true
    strip_html: true

hierarchy:
  traversal:
    mode: breadth_first
    threshold: 0.30
    max_depth: 10
    max_nodes_per_article: 100
  classification:
    positive_threshold: 0.50
  materialize_skipped_by_routing: false

templates:
  # Own copy (one line: the node's yes/no question), so the G-SIB templates can change independently.
  reuters_top10_v3:
    kind: boolean
    path: native_benchmarks/reuters_top10/template_v3.txt
    sha256: "97e9eac8e02122cfee3ae802dc5253d1e58aa20b687d608025c5b829868fe914"

models:
  strands:
    enabled: true
    adapter: systemone
    provider: local_server
    endpoint: http://127.0.0.1:8000     # strands-decider serve <ckpt> --model-name strands-decider-2B-hobson-v19
    model: StrandsAgents/strands-decider-2B-hobson-v19
    revisions:
      StrandsAgents/strands-decider-2B-hobson-v19: bb282d786bc251fd4e3068de3ada9ddbb38127cd
    quantization: none
    expected_model_returned: strands-decider-2B-hobson-v19
    provider_lock: []
    api_key_env: null
    template: reuters_top10_v3
    max_input_chars: 8000               # 3,072-token window shared with the questions
    shrink_on_422: true
    timeout_seconds: 120
    retries: 3
    concurrency: 4
    allow_returned_model_mismatch: false

  clm:
    enabled: true
    adapter: systemone
    provider: local_server
    endpoint: http://127.0.0.1:8700     # clm-serve over vllm serve Qwen/Qwen3-8B --runner pooling
    model: Contrastive-LM/CLM-v0.1-8B
    revisions:
      Contrastive-LM/CLM-v0.1-8B: e939398d4556fcd9400c76fa8c5a513202f42b0a
      Qwen/Qwen3-8B: b968826d9c46dd6066d109eabc6255188de91218
    quantization: none                  # bf16 encoder on a 24 GB L4 (colab/run_clm.ipynb); a T4 is too small
    expected_model_returned: clm-latest
    request_model: clm-latest
    provider_lock: []
    api_key_env: null
    template: reuters_top10_v3
    max_input_chars: 6000               # encoder truncates at 2,048 tokens; keep truncation explicit
    shrink_on_422: true
    timeout_seconds: 120
    retries: 3
    concurrency: 8
    allow_returned_model_mismatch: false

output:
  directory: classification_results_native
  format: parquet
  shard_rows: 5000
  include_raw_provider_response: false
