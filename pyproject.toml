[project]
name = "fin-decider-classifier"
version = "0.1.0"
description = "Hierarchical multi-label classification of Bloomberg news into a Basel-derived G-SIB ontology"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pyarrow>=17",
    "polars>=1.5",
    "datasketch>=1.6",
    "huggingface-hub>=0.25",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.scripts]
classify = "classifier.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
