# Ontology v1.1 additions over gsib_basel_ontology_v1.0.json
#
# EDIT THIS FILE, then run:  .venv/bin/python ontology/build_v1_1.py
# It writes gsib_basel_ontology_v1.1.json and ontology/v1.1_review.md.
#
# Node IDs, hierarchy, names and types are unchanged from v1.0. Per node:
#   label:       short plain phrase (<= 8 words) used as the label by encoder classifiers (GLiClass)
#   q:           plain yes/no question about the article (one sentence, concrete actor + activity)
#   when_true/when_false: one-sentence decision criteria; `when_false` names the hard boundary
#   add_excludes: extra exclusions appended to v1.0 `excludes` (optional)
#
# Shared principle ("material, not merely mentioned"): the article must report the
# activity actually happening (a deal, trade, loan, facility, programme, or a
# business line's performance), not just name a product, a price, or an institution.

# ── Relevance ──────────────────────────────────────────────────────────────────
relevance.gsib_activity:
  label: bank or dealer lending, underwriting, or trading
  q: Does the article describe a bank, dealer, or lender doing business, such as lending, underwriting, trading, market making, financing clients, or managing its own funding?
  when_true: A bank or dealer's lending, deal, trade, client financing, or funding activity is reported, or a bank business line's results or strategy are discussed.
  when_false: Only prices, economic data, policy, or non-bank company news, with no bank or dealer activity described.
  add_excludes: [central-bank policy decision without dealer activity, bank share-price move only]

relevance.market_context_only:
  label: market, economic, or company news without bank activity
  q: Is the article about financial markets, the economy, policy, or companies, without describing any bank or dealer lending, underwriting, trading for clients, or financing?
  when_true: Market moves, prices, economic data, central-bank or government policy, or company news, with no bank or dealer business activity described.
  when_false: A bank or dealer activity is described, or the article is not about markets or the economy at all.

relevance.neither:
  label: unrelated to finance or the economy
  q: Is the article unrelated to financial markets, the economy, and banking?
  when_true: General news such as sport, culture, crime, weather, or non-financial human-interest stories.
  when_false: Any financial-market, economic, policy, company, or banking content is discussed.

# ── Business arms ──────────────────────────────────────────────────────────────
business.markets:
  label: bank trading, underwriting, or derivatives business
  q: Does the article describe a bank or dealer trading, making markets, underwriting or syndicating deals, providing derivatives, or financing clients' securities positions?
  when_true: Sales and trading, market making, derivatives, securities financing, structured products, or underwriting activity by a bank or dealer is reported.
  when_false: Only asset prices or issuer news, or bank lending that is held as a loan with no markets activity.
  add_excludes: [asset-price movement without dealer activity]

business.lending:
  label: bank loan or credit facility
  q: Does the article describe a bank or lender providing, committing, arranging, or managing a loan or credit facility?
  when_true: A loan, revolver, credit line, mortgage, trade facility, or other credit extension by a bank or lender is reported.
  when_false: Only securities trading, underwriting of bonds or shares, or borrowing that is not from a bank or lender.
  add_excludes: [bond issuance without a loan]

business.treasury_alm:
  label: bank managing its own funding or liquidity
  q: Does the article describe a bank managing its own funding, liquidity, or balance-sheet interest-rate or currency risk?
  when_true: A bank's own funding raising, liquidity buffers, deposit or wholesale funding strategy, or structural rate/FX hedging is reported.
  when_false: Client trading, client financing, or central-bank policy without a bank's own balance-sheet management.
  add_excludes: [central-bank liquidity operations described only from the central bank's side]

# ── Treasury / ALM ─────────────────────────────────────────────────────────────
treasury.funding:
  label: bank raising its own funding
  q: Does the article describe a bank raising funding for its own balance sheet, for example by issuing its own bonds, covered bonds, or using wholesale or secured funding?
  when_true: A bank's own funding transaction or funding plan is reported.
  when_false: The bank finances a client, or only the funding market in general is discussed.
  add_excludes: [bank underwriting a client's bond]

treasury.liquidity:
  label: bank liquidity buffer management
  q: Does the article describe a bank managing its liquidity, liquidity buffer, or holdings of high-quality liquid assets?
  when_true: A bank's liquidity position, buffers, LCR, HQLA holdings, or liquidity actions are reported.
  when_false: Market liquidity in general, or a central bank providing liquidity with no bank-side management described.
  add_excludes: [general market liquidity conditions]

treasury.structural_rates:
  label: bank hedging its own interest-rate risk
  q: Does the article describe a bank managing or hedging the interest-rate risk on its own balance sheet?
  when_true: A bank's banking-book rate exposure, net-interest-income hedging, or IRRBB management is reported.
  when_false: Rates trading for clients, or general interest-rate moves.
  add_excludes: [interest-rate forecast without bank balance-sheet management]

treasury.structural_fx:
  label: bank hedging its own currency risk
  q: Does the article describe a bank managing or hedging currency risk on its own balance sheet or capital?
  when_true: A bank's structural FX exposure, capital hedging, or translation-risk management is reported.
  when_false: FX trading for clients, or general currency moves.
  add_excludes: [currency move without bank hedging]

# ── Markets families ───────────────────────────────────────────────────────────
markets.macro:
  label: dealer trading rates, currencies, or commodities
  q: Does the article describe a bank or dealer trading or making markets in government bonds, interest-rate products, currencies, commodities, inflation products, or emerging-market macro instruments?
  when_true: Dealer or bank trading, market making, or client flows in rates, FX, commodities, inflation, or EM macro products are reported.
  when_false: Only price or yield moves, economic data, or policy decisions, with no dealer or bank trading activity.
  add_excludes: [government bond yield move without dealer activity, currency move without dealer activity]

markets.credit:
  label: dealer trading corporate bonds or credit derivatives
  q: Does the article describe a bank or dealer trading, making markets in, or structuring corporate bonds, credit derivatives, or structured credit?
  when_true: Dealer or bank activity in corporate credit, CDS, credit indices, or tranched credit is reported.
  when_false: Only credit spreads or ratings news, or a company's bond issuance with no dealer trading described.
  add_excludes: [credit-rating action only]

markets.equities:
  label: dealer trading or structuring stocks
  q: Does the article describe a bank or dealer executing, trading, making markets in, or structuring stocks, equity derivatives, or equity-linked products?
  when_true: Dealer or bank equity trading, execution, derivatives, or structured-equity activity is reported.
  when_false: Only share-price moves, earnings, or stock-market commentary with no dealer activity.
  add_excludes: [share-price move only, issuer earnings]

markets.securitised:
  label: bank creating or trading mortgage or asset-backed securities
  q: Does the article describe a bank or dealer creating, warehousing, trading, or selling mortgage-backed, asset-backed, CLO, or CDO securities?
  when_true: Securitisation deals, dealer trading, or warehousing of RMBS, CMBS, ABS, CLOs, or CDOs is reported.
  when_false: Only the underlying loans (mortgages, car loans) with no securitisation activity.
  add_excludes: [loan origination without securitisation]

markets.financing:
  label: dealer financing clients' securities positions
  q: Does the article describe a bank or dealer financing clients' securities positions through repo, securities lending, prime brokerage, margin loans, or total-return swaps?
  when_true: Client securities-financing activity by a bank or dealer is reported.
  when_false: Central-bank repo policy, a bank's own funding, or hedge-fund news without dealer financing.
  add_excludes: [central-bank repo operations, bank treasury funding]

markets.derivatives_xva:
  label: bank derivatives, clearing, or CVA
  q: Does the article describe a bank or dealer providing OTC or cleared derivatives, clearing services for clients, or managing derivative valuation adjustments such as CVA?
  when_true: Dealer derivatives activity, client clearing, CCP clearing by a bank, or XVA/CVA management is reported.
  when_false: Exchange or regulator news without bank derivatives activity, or derivatives only named in passing.
  add_excludes: [derivatives regulation without bank activity]

markets.underwriting:
  label: banks underwriting a bond, share, or loan deal
  q: Does the article describe banks underwriting, arranging, or running the books on a bond sale, share offering, IPO, or syndicated loan?
  when_true: Banks are reported as underwriters, bookrunners, arrangers, or placement agents on a debt, equity, or loan deal.
  when_false: The issuer raises money but no bank role is described, or only secondary-market trading.
  add_excludes: [issuance with no bank role described]

# ── Markets leaves ─────────────────────────────────────────────────────────────
markets.macro.rates:
  label: dealer trading government bonds or interest-rate swaps
  q: Does the article describe a bank or dealer trading or making markets in government bonds, interest-rate swaps, swaptions, or rates futures and options?
  when_true: Dealer activity in rates products is reported, such as primary dealer bidding, swap trading, or client rates flows.
  when_false: Only yield or interest-rate moves, central-bank decisions, or a bank's own balance-sheet hedging.
  add_excludes: [yield move without dealer activity, central-bank rate decision]

markets.macro.fx:
  label: dealer trading currencies for clients
  q: Does the article describe a bank or dealer trading or making markets in currencies, FX forwards, FX swaps, or currency options for clients?
  when_true: Dealer FX trading, client currency flows, or FX derivatives activity by a bank is reported.
  when_false: Only exchange-rate moves or currency policy, or a bank hedging its own structural FX.
  add_excludes: [exchange-rate move without dealer activity]

markets.macro.commodities:
  label: dealer trading commodities or commodity derivatives
  q: Does the article describe a bank or dealer trading commodities or providing commodity derivatives such as futures or swaps?
  when_true: Bank or dealer commodity trading, hedging for clients, or commodity derivatives activity is reported.
  when_false: Only commodity prices, supply, or production news, or a bank lending against commodities.
  add_excludes: [commodity price move without dealer activity]

markets.macro.inflation:
  label: dealer trading inflation-linked products
  q: Does the article describe a bank or dealer trading or making markets in inflation-linked bonds, inflation swaps, or inflation options?
  when_true: Dealer activity in inflation-linked products is reported.
  when_false: Only inflation data, forecasts, or policy.
  add_excludes: [inflation data release]

markets.macro.emerging_markets:
  label: dealer trading emerging-market currencies or bonds
  q: Does the article describe a bank or dealer trading emerging-market currencies, local-currency government bonds, or other emerging-market macro instruments?
  when_true: Dealer activity or client flows in EM FX, EM rates, or EM sovereign debt are reported.
  when_false: Only emerging-market price moves or economic news, or lending to EM companies.
  add_excludes: [EM currency or bond price move without dealer activity]

markets.credit.investment_grade:
  label: dealer trading investment-grade corporate bonds
  q: Does the article describe a bank or dealer trading or making markets in investment-grade corporate bonds?
  when_true: Dealer trading, inventory, or client flows in investment-grade corporate bonds are reported.
  when_false: Only spreads or ratings, new bond issuance without trading, or loans.
  add_excludes: [IG bond issuance without secondary trading]

markets.credit.high_yield_distressed:
  label: dealer trading junk or distressed debt
  q: Does the article describe a bank or dealer trading or making markets in high-yield (junk) or distressed debt?
  when_true: Dealer trading, inventory, or client flows in high-yield or distressed debt are reported.
  when_false: Only defaults, ratings, or junk-bond issuance without dealer trading.
  add_excludes: [default or bankruptcy news without dealer trading]

markets.credit.credit_derivatives:
  label: dealer trading credit default swaps
  q: Does the article describe a bank or dealer trading or structuring credit default swaps or credit indices?
  when_true: Dealer activity in CDS, CDX, iTraxx, or other credit derivatives is reported.
  when_false: CDS prices quoted only as a market indicator, or cash bond trading.
  add_excludes: [CDS level cited only as a risk indicator]

markets.credit.structured_credit:
  label: bank structuring tranched credit products
  q: Does the article describe a bank or dealer structuring or trading tranched or bespoke credit products, such as synthetic CDOs or correlation trades?
  when_true: Structuring or trading of tranched or bespoke credit risk by a bank or dealer is reported.
  when_false: Plain corporate bonds, CLO/CDO securitisation of loans, or credit-index trading only.

markets.equities.cash:
  label: broker executing stock trades for clients
  q: Does the article describe a bank or broker executing or trading stocks for clients or making markets in shares, such as block trades?
  when_true: A bank or broker's cash-equity execution, block trade, or market-making activity is reported.
  when_false: Only share-price moves, index levels, or equity underwriting.
  add_excludes: [stock-index move]

markets.equities.derivatives:
  label: dealer trading equity options or swaps
  q: Does the article describe a bank or dealer trading or structuring equity options, equity swaps, or index derivatives?
  when_true: Dealer activity in equity derivatives is reported.
  when_false: Option prices or volatility levels quoted only as a market indicator, or cash-equity trading.
  add_excludes: [implied volatility cited only as a market indicator]

markets.equities.structured:
  label: bank selling equity-linked structured notes
  q: Does the article describe a bank structuring or selling equity-linked notes or other structured equity products?
  when_true: A bank's structured equity products, such as equity-linked notes, are reported.
  when_false: Plain options or futures, or share offerings.

markets.securitised.rmbs:
  label: residential mortgage-backed securities deal or trading
  q: Does the article describe a bank or dealer creating, trading, or selling residential mortgage-backed securities?
  when_true: RMBS issuance, structuring, trading, or warehousing by a bank or dealer is reported.
  when_false: Home-loan lending or house prices with no mortgage-backed securities activity.
  add_excludes: [house-price data]

markets.securitised.cmbs:
  label: commercial mortgage-backed securities deal or trading
  q: Does the article describe a bank or dealer creating, trading, or selling commercial mortgage-backed securities?
  when_true: CMBS issuance, structuring, trading, or warehousing by a bank or dealer is reported.
  when_false: Direct commercial property loans or property-market news without CMBS activity.
  add_excludes: [commercial property prices]

markets.securitised.abs:
  label: asset-backed securities deal or trading
  q: Does the article describe a bank or dealer creating, trading, or selling asset-backed securities such as auto-loan or credit-card ABS?
  when_true: ABS issuance, structuring, trading, or warehousing by a bank or dealer is reported.
  when_false: Consumer loans themselves, or RMBS/CMBS.

markets.securitised.clo_cdo:
  label: CLO or CDO deal or trading
  q: Does the article describe a bank or dealer creating, warehousing, trading, or selling collateralised loan obligations or CDOs?
  when_true: CLO or CDO issuance, warehousing, structuring, or trading by a bank or dealer is reported.
  when_false: Leveraged loans themselves without a CLO or CDO.

markets.financing.repo:
  label: dealer repo financing for clients
  q: Does the article describe a bank or dealer providing repo or reverse-repo financing to clients against securities?
  when_true: Dealer repo or reverse-repo financing for clients, or repo desk activity, is reported.
  when_false: Central-bank repo rates or operations, or a bank using repo for its own funding.
  add_excludes: [Federal Reserve reverse repo facility usage]

markets.financing.securities_lending:
  label: securities lending to short sellers
  q: Does the article describe a bank or agent lending or borrowing securities for clients, such as stock borrow for short sellers?
  when_true: Securities lending or borrowing activity by a bank, custodian, or prime broker is reported.
  when_false: Short interest figures alone, or ordinary secured loans.
  add_excludes: [short-interest data only]

markets.financing.prime:
  label: prime brokerage for hedge funds
  q: Does the article describe a bank providing prime brokerage financing or services to hedge funds?
  when_true: A bank's prime brokerage business, hedge-fund financing, or prime client exposure is reported.
  when_false: Hedge-fund performance or strategy news without the bank's prime brokerage role.
  add_excludes: [hedge-fund returns]

markets.financing.margin:
  label: margin loans against securities
  q: Does the article describe a bank or broker lending against securities to finance clients' positions, such as margin loans?
  when_true: Margin lending, margin calls by a lender, or securities-backed lending is reported.
  when_false: Unsecured consumer loans, or exchange margin requirements without a lender.
  add_excludes: [exchange margin requirement change]

markets.financing.synthetic:
  label: total-return swap financing
  q: Does the article describe a bank financing a client's exposure synthetically through total-return swaps or similar derivatives?
  when_true: Total-return swap or synthetic prime financing provided by a bank is reported.
  when_false: Derivatives used purely for hedging with no financing purpose.

markets.derivatives.otc:
  label: bank over-the-counter derivatives trades
  q: Does the article describe a bank or dealer entering into bilateral over-the-counter derivatives with clients or counterparties?
  when_true: Bank or dealer OTC derivative trades, exposures, or client OTC business are reported.
  when_false: Exchange-traded futures only, or derivatives mentioned only in passing.

markets.derivatives.cleared:
  label: centrally cleared derivatives trading by banks
  q: Does the article describe a bank or dealer trading derivatives that are centrally cleared through a clearing house?
  when_true: Bank or dealer activity in cleared swaps or centrally cleared derivatives is reported.
  when_false: Bilateral OTC derivatives, or clearing-house news without bank activity.

markets.derivatives.client_clearing:
  label: bank clearing derivatives for clients
  q: Does the article describe a bank providing clearing access or clearing services to clients for derivatives or futures?
  when_true: A bank's client clearing or futures clearing business is reported.
  when_false: Clearing-house or regulator news without a bank clearing for clients.
  add_excludes: [CCP corporate news without bank clearing members]

markets.derivatives.xva:
  label: bank CVA or XVA charges
  q: Does the article describe a bank pricing, hedging, or reporting valuation adjustments on derivatives, such as CVA, FVA, or XVA?
  when_true: A bank's CVA, FVA, or other XVA charges, desks, hedging, or losses are reported.
  when_false: Derivatives activity with no valuation-adjustment element.

markets.underwriting.dcm:
  label: banks underwriting a bond sale
  q: Does the article describe banks underwriting, arranging, or running the books on a bond sale?
  when_true: Banks are named or described as underwriters, bookrunners, or arrangers of a bond or debt issue.
  when_false: A company sells bonds with no bank role described, or only secondary bond trading.
  add_excludes: [bond sale with no bank role described]

markets.underwriting.ecm:
  label: banks underwriting an IPO or share sale
  q: Does the article describe banks underwriting or running the books on an IPO, share sale, or convertible bond offering?
  when_true: Banks are named or described as underwriters, bookrunners, or placement agents on an equity or equity-linked deal.
  when_false: IPO plans or share sales with no bank role described, or secondary stock trading.
  add_excludes: [IPO with no bank role described]

markets.underwriting.loan_syndication:
  label: banks syndicating a loan
  q: Does the article describe banks arranging or syndicating a loan across multiple lenders?
  when_true: A syndicated loan, its arrangers or bookrunners, or loan distribution to lenders is reported.
  when_false: A single bank's bilateral loan, or a bond deal.

# ── Lending families ───────────────────────────────────────────────────────────
lending.corporate:
  label: bank loan to a company
  q: Does the article describe a bank lending to a company through a general-purpose loan, term loan, or revolving credit facility?
  when_true: A bank loan or credit facility to a company for general corporate purposes is reported.
  when_false: Leveraged buyout or acquisition financing, project or asset-specific financing, or company bond sales.
  add_excludes: [corporate bond issuance]

lending.leveraged_sponsor:
  label: leveraged buyout or acquisition financing
  q: Does the article describe banks providing leveraged loans, buyout financing, acquisition financing, or bridge loans?
  when_true: Leveraged lending, private-equity-sponsor financing, acquisition loans, or bridge financing by banks is reported.
  when_false: An acquisition with no debt financing described, or high-yield bond trading.
  add_excludes: [M&A deal with no financing described]

lending.specialised:
  label: project, aircraft, ship, or commodity financing
  q: Does the article describe a bank financing a specific project, physical asset, or commodity where repayment depends on that project, asset, or commodity?
  when_true: Project finance, asset/object finance (aircraft, ships), or structured commodity finance by a lender is reported.
  when_false: General company loans, or project, asset, or commodity news without financing.
  add_excludes: [project announcement without financing]

lending.cre:
  label: bank lending on commercial property
  q: Does the article describe a bank lending against commercial real estate such as offices, shopping centres, hotels, or development projects?
  when_true: Commercial property loans, CRE loan books, or construction and development lending are reported.
  when_false: Property prices or deals with no lending, CMBS, or home mortgages.
  add_excludes: [commercial property sale without financing]

lending.financial_institutions:
  label: bank lending to financial firms or funds
  q: Does the article describe a bank lending to other financial firms, such as banks, broker-dealers, insurers, finance companies, or investment funds?
  when_true: Credit facilities or loans from a bank to a financial institution or fund are reported.
  when_false: Central-bank lending to banks, interbank rates, or trading between dealers.
  add_excludes: [central-bank emergency lending, interbank rate move]

lending.sovereign_public:
  label: bank loan to a government
  q: Does the article describe a bank lending to a government, sovereign, or public-sector body?
  when_true: A bank loan or credit facility to a government, state entity, municipality, or public institution is reported.
  when_false: Government bond trading or issuance, or IMF/multilateral lending without banks.
  add_excludes: [IMF or multilateral programme without bank lending, sovereign bond auction]

lending.trade_working_capital:
  label: trade finance or letters of credit
  q: Does the article describe a bank providing trade finance, letters of credit, guarantees, or supply-chain or receivables financing?
  when_true: Trade loans, letters of credit, bank guarantees, factoring, or supply-chain finance are reported.
  when_false: Trade data or tariffs without bank financing.
  add_excludes: [trade statistics or tariffs]

lending.consumer:
  label: credit cards, car loans, or personal loans
  q: Does the article describe a bank or lender providing credit to individuals through credit cards, car loans, or personal loans?
  when_true: Consumer lending, card balances, auto loans, or personal-loan books are reported.
  when_false: Consumer spending data without credit, or home mortgages.
  add_excludes: [retail sales data]

lending.residential_mortgage:
  label: home mortgage lending
  q: Does the article describe a bank or lender providing home loans secured on residential property?
  when_true: Residential mortgage lending, mortgage books, or home-equity credit is reported.
  when_false: House prices or housing starts without lending, or mortgage-backed securities.
  add_excludes: [house prices without lending]

# ── Lending leaves ─────────────────────────────────────────────────────────────
lending.corporate.large:
  label: loan to a large company
  q: Does the article describe a bank lending to a large company through a general-purpose loan or revolving credit facility?
  when_true: A loan or facility to a large or investment-grade company for general purposes is reported.
  when_false: Leveraged, acquisition, or project financing, or loans to small businesses.

lending.corporate.middle_market:
  label: loan to a mid-sized company
  q: Does the article describe a bank lending to a mid-sized company?
  when_true: Lending to middle-market companies, or a bank's middle-market lending business, is reported.
  when_false: Loans to large corporates, small businesses, or individuals.

lending.corporate.sme:
  label: loan to a small business
  q: Does the article describe a bank lending to small or medium-sized businesses?
  when_true: SME or small-business lending, including government-backed small-business loan schemes run through banks, is reported.
  when_false: Personal loans to individuals, or lending to large companies.

lending.leveraged_sponsor.leveraged_loan:
  label: leveraged loan to an indebted company
  q: Does the article describe banks providing leveraged loans to highly indebted or below-investment-grade companies, such as term loan B?
  when_true: Leveraged loans, term loan B, or a bank's leveraged-loan pipeline or exposure are reported.
  when_false: High-yield bond trading, or investment-grade corporate loans.

lending.leveraged_sponsor.acquisition:
  label: loan financing an acquisition or buyout
  q: Does the article describe banks providing debt financing for an acquisition, merger, or buyout?
  when_true: Loans or committed financing from banks to fund an acquisition or leveraged buyout are reported.
  when_false: An acquisition with no debt financing described, or a general loan unrelated to an acquisition.

lending.leveraged_sponsor.bridge:
  label: bridge loan for a deal
  q: Does the article describe a bank providing a bridge loan to fund a deal until permanent financing is raised?
  when_true: A bridge loan, bridge facility, or bridge-to-bond financing is reported.
  when_false: Ordinary revolving credit or term loans.

lending.specialised.project_finance:
  label: loan for a power or infrastructure project
  q: Does the article describe lenders financing a specific project, such as a power plant, pipeline, or infrastructure, repaid from the project's own revenues?
  when_true: Project finance, non-recourse or limited-recourse project debt, or a project-company loan is reported.
  when_false: General corporate borrowing by an infrastructure or energy company, or project news without financing.
  add_excludes: [project construction news without financing]

lending.specialised.object_finance:
  label: financing a specific aircraft or ship
  q: Does the article describe a bank financing a specific aircraft, ship, railcar, or other physical asset, with repayment tied to that asset?
  when_true: Aircraft, ship, rail, or equipment financing or leasing finance tied to specific assets is reported.
  when_false: Aircraft or ship orders and deliveries, or a general loan to an airline or shipping company.

lending.specialised.commodity_finance:
  label: financing commodity reserves or inventories
  q: Does the article describe a bank financing commodity reserves, inventories, or trade flows, with repayment tied to the commodity?
  when_true: Reserve-based lending, structured commodity finance, or inventory financing for commodity traders or producers is reported.
  when_false: Commodity prices or trading, or a general working-capital loan.

lending.cre.general:
  label: commercial property loan
  q: Does the article describe a bank making or holding loans secured on commercial property?
  when_true: Commercial mortgages, CRE loans, or a bank's commercial-property loan book are reported.
  when_false: Property deals without lending, CMBS, or home mortgages.

lending.cre.ipre:
  label: loan on a rented office, hotel, or building
  q: Does the article describe a bank lending against an income-producing property, such as an office, hotel, or rental building, repaid from its rents?
  when_true: Loans on rented or income-generating commercial property, where repayment depends on property income, are reported.
  when_false: Corporate loans not dependent on property income, or construction loans.

lending.cre.hvcre:
  label: construction or development property loan
  q: Does the article describe a bank financing the acquisition, development, or construction of commercial real estate?
  when_true: Construction, development, or land-acquisition lending for commercial property is reported.
  when_false: Loans on completed, stabilised properties.

lending.fi.banks:
  label: loan to a bank or broker-dealer
  q: Does the article describe a bank lending to another bank or to a broker-dealer?
  when_true: Loans or credit lines from a bank to another bank or broker-dealer are reported.
  when_false: Central-bank lending, interbank rates, or trading between dealers.

lending.fi.nbfis:
  label: loan to an insurer or finance company
  q: Does the article describe a bank lending to an insurer, finance company, asset manager, or other non-bank financial firm?
  when_true: Credit facilities or loans from banks to non-bank financial institutions are reported.
  when_false: Hedge-fund prime brokerage, or lending to investment funds (fund finance).

lending.fi.funds:
  label: credit line to an investment fund
  q: Does the article describe a bank lending to an investment fund, such as a subscription line or NAV facility for a private-equity fund?
  when_true: Subscription lines, capital-call facilities, NAV loans, or other fund-level lending are reported.
  when_false: Prime brokerage or margin financing of hedge funds, or fund performance news.

lending.trade.trade_loans:
  label: import or export loan
  q: Does the article describe a bank providing short-term loans to finance imports, exports, or traded goods?
  when_true: Import, export, pre-export, or other trade loans are reported.
  when_false: General corporate term loans or trade statistics.

lending.trade.lc_guarantees:
  label: letter of credit or bank guarantee
  q: Does the article describe a bank issuing letters of credit or guarantees for a client?
  when_true: Documentary or standby letters of credit, or bank guarantees, are reported.
  when_false: Funded loans, or government guarantees without a bank issuing them.

lending.trade.receivables_supply_chain:
  label: invoice, factoring, or supply-chain finance
  q: Does the article describe a bank financing a company's invoices, receivables, or supplier payments, such as factoring or supply-chain finance?
  when_true: Receivables finance, invoice finance, factoring, or supply-chain finance programmes are reported.
  when_false: Securities financing, or supply-chain disruption news without financing.
  add_excludes: [supply-chain disruption news]

lending.consumer.cards:
  label: credit-card lending
  q: Does the article describe a bank or card issuer lending to consumers through credit cards?
  when_true: Credit-card lending, card balances, or card loan losses are reported.
  when_false: Payment processing or debit cards without credit.

lending.consumer.auto:
  label: car loan to a consumer
  q: Does the article describe a bank or lender financing consumers' car or vehicle purchases?
  when_true: Auto loans or car finance to consumers are reported.
  when_false: Car sales without financing, or commercial fleet financing.
  add_excludes: [car sales data]

lending.consumer.personal:
  label: personal loan to an individual
  q: Does the article describe a bank or lender making personal loans or instalment loans to individuals?
  when_true: Personal or consumer instalment lending is reported.
  when_false: Mortgages, credit cards, car loans, or loans to companies.

lending.mortgage.owner_occupied:
  label: mortgage for a home buyer
  q: Does the article describe a bank or lender providing mortgages to people buying homes to live in?
  when_true: Owner-occupied home-loan lending, approvals, or mortgage books are reported.
  when_false: Buy-to-let mortgages, mortgage-backed securities, or house prices alone.

lending.mortgage.income_producing:
  label: buy-to-let mortgage
  q: Does the article describe a bank or lender providing buy-to-let or other mortgages on residential property rented out to tenants?
  when_true: Buy-to-let or rental-property residential mortgage lending is reported.
  when_false: Owner-occupied mortgages, or commercial property loans.

lending.mortgage.home_equity:
  label: home-equity loan
  q: Does the article describe a bank or lender providing home-equity loans or lines of credit secured on homeowners' equity?
  when_true: Home-equity loans or HELOCs are reported.
  when_false: First-lien purchase mortgages.
